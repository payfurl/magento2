# Unit tests and static checks on every supported PHP version. Composer resolves the newest Magento 2.4.x each PHP
# version allows (8.2: 2.4.7, 8.3/8.4: 2.4.8, 8.5: 2.4.9). The browser e2e suite runs in payfurl/platform
# (`just e2e magento`, or `just e2e` here), against the payFURL stack built from source.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, gd, intl, pdo_mysql, soap, sockets, sodium, xsl, zip
          tools: composer:v2
          coverage: none
      - name: Install (Magento packages from the Mage-OS mirror)
        run: composer update --no-interaction --no-progress
      - name: Unit tests
        run: vendor/bin/phpunit
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Magento coding standard (errors fail; warnings are reported)
        run: vendor/bin/phpcs -q --warning-severity=0
