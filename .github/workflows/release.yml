# Releases the module's version once: on every push to main (a merged pull request that bumps the version, such as
# sdk-bump.yml's, releases itself) and on a pushed vX.Y.Z tag. A version that already has a GitHub release is
# skipped. The tag must match composer.json's version (Packagist skips a tag that doesn't). The workflow creates the
# GitHub release (and its vX.Y.Z tag, on the pushed commit) with the version's CHANGELOG.md section as notes;
# Packagist picks up the tag itself, through its GitHub hook on this repo. A failed run is retried by re-running it.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The version, unless it is released
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version composer.json)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but composer.json's version is $version"
            exit 1
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is released"
            exit 0
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        if: steps.version.outputs.version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The lines between "## [VERSION]" and the next "## " heading.
          awk -v heading="## [$VERSION]" 'index($0, "## ") == 1 { found = (index($0, heading) == 1); next } found' \
            CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no \"## [$VERSION]\" section"
            exit 1
          fi

      - name: GitHub release
        if: steps.version.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
