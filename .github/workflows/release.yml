# Pushing a vX.Y.Z tag releases that version: the tag must match composer.json's version (Packagist skips a tag
# that doesn't), the GitHub release gets the version's CHANGELOG.md section as notes, and Packagist is told to update.
# Secrets: PACKAGIST_USERNAME and PACKAGIST_TOKEN (a payfurl/module-payment maintainer's API token,
# packagist.org > Profile > Show API Token).
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches composer.json
        id: version
        run: |
          version=$(jq -r .version composer.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but composer.json's version is $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The lines between "## [VERSION]" and the next "## " heading.
          awk -v heading="## [$VERSION]" 'index($0, "## ") == 1 { found = (index($0, heading) == 1); next } found' \
            CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no \"## [$VERSION]\" section"
            exit 1
          fi

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md

      - name: Packagist update
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          curl -fsS -X POST -H 'Content-Type: application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -d '{"repository":{"url":"https://packagist.org/packages/payfurl/module-payment"}}'
