# Pushing a vX.Y.Z tag releases that version: the tag must match composer.json's version (Packagist skips a tag
# that doesn't), and the GitHub release gets the version's CHANGELOG.md section as notes. Packagist picks up the tag
# itself, through its GitHub hook on this repo.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches composer.json
        id: version
        run: |
          version=$(jq -r .version composer.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but composer.json's version is $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The lines between "## [VERSION]" and the next "## " heading.
          awk -v heading="## [$VERSION]" 'index($0, "## ") == 1 { found = (index($0, heading) == 1); next } found' \
            CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no \"## [$VERSION]\" section"
            exit 1
          fi

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
