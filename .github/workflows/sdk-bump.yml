# New SDK releases open PRs.
#
# browser-sdk: a new browser SDK in production. A new @payfurl/client on npm is the signal: only the platform's
# master `deploy sdk` publishes it, while sandbox uploads /vX.Y.Z/ to the asset bucket earlier, so an asset URL
# existing is not one. The PR bumps the pinned assets.payfurl.com URL (and PayfurlAdapter::BROWSER_SDK_VERSION, which
# /info/providers is told) and the patch version and adds a changelog entry.
#
# php-sdk: a new payfurl/phpsdk on Packagist (repo.packagist.org/p2, no token). Composer already installs any 3.x
# release for the module's `^3.x` constraint, so a minor or patch PR raises the minimum to the new version, which
# this release has then been tested with. A new major is not compatible: its PR is a draft that only changes the
# constraint, to start the migration from.
#
# A version is skipped once a PR for its branch exists (open, merged or closed). A run that pushed the branch but
# failed to open the PR is retried the next night: the branch is force-pushed again from main.
#
# A minor or patch PR merges itself once CI passes (gh pr merge --auto), and release.yml then releases the new version
# from main. That needs a ruleset requiring status checks on main (without one the PR is left to a person) and the
# SDK_BUMP_TOKEN secret, a fine-grained token with contents and pull-requests write on this repository: GitHub runs
# no CI on a PR opened with the default token, and starts no release.yml for a merge made with it. The e2e suite in
# payfurl/platform is not part of CI: its store loads the browser SDK built from source, not the pinned release.
name: SDK bump

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  browser-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SDK_BUMP_TOKEN || github.token }}

      - name: Compare the pinned SDK with npm
        id: sdk
        env:
          GH_TOKEN: ${{ secrets.SDK_BUMP_TOKEN || github.token }}
        run: |
          latest=$(npm view @payfurl/client version)
          if ! [[ "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::unexpected npm version '$latest'"
            exit 1
          fi
          pinned=$(sed -nE 's#.*assets\.payfurl\.com/v([0-9.]+)/js/payfurl\.js.*#\1#p' view/frontend/requirejs-config.js)
          echo "pinned v$pinned, npm v$latest"
          branch="sdk-bump/v$latest"
          prs=$(gh pr list --head "$branch" --state all --json number --jq length)
          if [ "$latest" = "$pinned" ] || [ "$prs" != 0 ]; then
            echo "nothing to do"
            exit 0
          fi
          curl -fsSI "https://assets.payfurl.com/v$latest/js/payfurl.js" >/dev/null
          { echo "latest=$latest"; echo "pinned=$pinned"; echo "branch=$branch"; } >> "$GITHUB_OUTPUT"

      - name: Open the PR
        if: steps.sdk.outputs.latest
        env:
          GH_TOKEN: ${{ secrets.SDK_BUMP_TOKEN || github.token }}
          LATEST: ${{ steps.sdk.outputs.latest }}
          PINNED: ${{ steps.sdk.outputs.pinned }}
          BRANCH: ${{ steps.sdk.outputs.branch }}
        run: |
          sed -i "s#assets.payfurl.com/v$PINNED/js/payfurl.js#assets.payfurl.com/v$LATEST/js/payfurl.js#" \
            view/frontend/requirejs-config.js
          sed -i -E "s/(BROWSER_SDK_VERSION = ')[0-9.]+(')/\1$LATEST\2/" Model/Adapter/PayfurlAdapter.php
          current=$(jq -r .version composer.json)
          next=$(echo "$current" | awk -F. '{ printf "%d.%d.%d", $1, $2, $3 + 1 }')
          sed -i "s/\"version\": \"$current\"/\"version\": \"$next\"/" composer.json

          # A new section under "## [Unreleased]", and its compare link.
          entry="## [$next] - $(date -u +%F)\n\n### Changed\n\n- Browser SDK updated from v$PINNED to v$LATEST\n  ([SDK changelog](https://docs.payfurl.com/client_sdk/changelog)).\n"
          awk -v entry="$entry" '{ print } /^## \[Unreleased\]/ { printf "\n%s", entry }' CHANGELOG.md > CHANGELOG.tmp
          sed -i -E "s#^\[Unreleased\]: (.*)/compare/v[0-9.]+\.\.\.HEAD#[Unreleased]: \1/compare/v$next...HEAD\n[$next]: \1/compare/v$current...v$next#" CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git commit -am "Browser SDK v$LATEST (module $next)"
          git push --force origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "Browser SDK v$LATEST (module $next)" --body \
            "Pins the browser SDK released to production as @payfurl/client v$LATEST ([changelog](https://docs.payfurl.com/client_sdk/changelog)) and bumps the module to $next.

          It merges itself once CI passes, and the merge releases v$next (release.yml)."

      - name: Merge it once CI passes
        if: steps.sdk.outputs.latest
        env:
          GH_TOKEN: ${{ secrets.SDK_BUMP_TOKEN || github.token }}
          BRANCH: ${{ steps.sdk.outputs.branch }}
        run: |
          # Without required checks, --auto would merge at once: leave the PR to a person.
          checks=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" --jq '[.[] | select(.type == "required_status_checks")] | length')
          if [ "$checks" = 0 ]; then
            echo "::warning::main requires no checks: merge the PR by hand"
            exit 0
          fi
          gh pr merge "$BRANCH" --auto --merge

  php-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SDK_BUMP_TOKEN || github.token }}

      - name: Compare the required SDK with Packagist
        id: sdk
        env:
          GH_TOKEN: ${{ secrets.SDK_BUMP_TOKEN || github.token }}
        run: |
          latest=$(curl -fsS https://repo.packagist.org/p2/payfurl/phpsdk.json \
            | jq -r '.packages["payfurl/phpsdk"][].version' | sed 's/^v//' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$latest" ]; then
            echo "::error::no payfurl/phpsdk release on Packagist"
            exit 1
          fi
          constraint=$(jq -r '.require["payfurl/phpsdk"]' composer.json)
          if ! [[ "$constraint" =~ ^\^([0-9]+)(\.[0-9]+)?(\.[0-9]+)?$ ]]; then
            echo "::error::composer.json requires payfurl/phpsdk '$constraint', not ^X.Y.Z: bump it by hand"
            exit 1
          fi
          major=${BASH_REMATCH[1]}
          required="$major${BASH_REMATCH[2]:-.0}${BASH_REMATCH[3]:-.0}"
          echo "required $required ($constraint), Packagist $latest"
          branch="phpsdk-bump/v$latest"
          prs=$(gh pr list --head "$branch" --state all --json number --jq length)
          if [ "$(printf '%s\n' "$required" "$latest" | sort -V | tail -1)" = "$required" ] \
            || [ "$prs" != 0 ]; then
            echo "nothing to do"
            exit 0
          fi
          { echo "latest=$latest"; echo "required=$required"; echo "branch=$branch"
            echo "major=$([ "${latest%%.*}" != "$major" ] && echo true || echo false)"; } >> "$GITHUB_OUTPUT"

      - name: Open the PR
        if: steps.sdk.outputs.latest
        env:
          GH_TOKEN: ${{ secrets.SDK_BUMP_TOKEN || github.token }}
          LATEST: ${{ steps.sdk.outputs.latest }}
          REQUIRED: ${{ steps.sdk.outputs.required }}
          BRANCH: ${{ steps.sdk.outputs.branch }}
          MAJOR: ${{ steps.sdk.outputs.major }}
        run: |
          sed -i -E "s#(\"payfurl/phpsdk\": \")[^\"]+\"#\\1^$LATEST\"#" composer.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          sdk_changelog="https://github.com/payfurl/phpsdk/blob/v$LATEST/CHANGELOG.md"

          if [ "$MAJOR" = true ]; then
            git commit -am "payfurl/phpsdk v$LATEST: a new major, to migrate to"
            git push --force origin "$BRANCH"
            gh pr create --draft --base main --head "$BRANCH" --title "payfurl/phpsdk v$LATEST (new major: needs a migration)" --body \
              "payfurl/phpsdk v$LATEST is a new major version ([changelog]($sdk_changelog), and the SDK's UPGRADE.md). This draft only changes the constraint from ^$REQUIRED to ^$LATEST: the module's SDK calls (Model/Adapter/PayfurlAdapter.php) need migrating by hand, with the module's own major or minor version and changelog entry.

          Before merging, run the e2e suite against this branch from a payfurl/platform checkout: \`MAGENTO_PLUGIN_DIR=<this checkout> just e2e magento\`."
            exit 0
          fi

          current=$(jq -r .version composer.json)
          next=$(echo "$current" | awk -F. '{ printf "%d.%d.%d", $1, $2, $3 + 1 }')
          sed -i "s/\"version\": \"$current\"/\"version\": \"$next\"/" composer.json
          entry="## [$next] - $(date -u +%F)\n\n### Changed\n\n- Requires payfurl/phpsdk $LATEST or a later 3.x (was $REQUIRED)\n  ([SDK changelog]($sdk_changelog)).\n"
          awk -v entry="$entry" '{ print } /^## \[Unreleased\]/ { printf "\n%s", entry }' CHANGELOG.md > CHANGELOG.tmp
          sed -i -E "s#^\[Unreleased\]: (.*)/compare/v[0-9.]+\.\.\.HEAD#[Unreleased]: \1/compare/v$next...HEAD\n[$next]: \1/compare/v$current...v$next#" CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md

          git commit -am "payfurl/phpsdk v$LATEST (module $next)"
          git push --force origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "payfurl/phpsdk v$LATEST (module $next)" --body \
            "Requires payfurl/phpsdk $LATEST ([changelog]($sdk_changelog)), the release now on Packagist, and bumps the module to $next. Stores already get it through the module's caret constraint: this sets the minimum to the version it was tested with.

          It merges itself once CI passes, and the merge releases v$next (release.yml). To check it first, turn off auto-merge on this PR and run the e2e suite against this branch from a payfurl/platform checkout: \`MAGENTO_PLUGIN_DIR=<this checkout> just e2e magento\`."

      - name: Merge it once CI passes
        if: steps.sdk.outputs.latest && steps.sdk.outputs.major == 'false'
        env:
          GH_TOKEN: ${{ secrets.SDK_BUMP_TOKEN || github.token }}
          BRANCH: ${{ steps.sdk.outputs.branch }}
        run: |
          # Without required checks, --auto would merge at once: leave the PR to a person.
          checks=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" --jq '[.[] | select(.type == "required_status_checks")] | length')
          if [ "$checks" = 0 ]; then
            echo "::warning::main requires no checks: merge the PR by hand"
            exit 0
          fi
          gh pr merge "$BRANCH" --auto --merge
